[tool.poetry]
name = "mnemosyne"
version = "0.1.0"
description = "Personal Knowledge Management System with AI-powered pattern discovery"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "mnemosyne", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
weaviate-client = "^4.0.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
langchain-weaviate = "^0.0.3"
langgraph = "^0.2.0"
langgraph-checkpoint-sqlite = "^2.0.11"
psycopg2-binary = "^2.9.9"
python-telegram-bot = "^21.0"
watchdog = "^4.0.0"
ollama = "^0.3.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
aiohttp = "^3.9.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
neo4j = "^5.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"
pytest-docker = "^2.0.0"
freezegun = "^1.2.2"
responses = "^0.23.0"
black = "^24.0.0"
ruff = "^0.14.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"
apscheduler = "^3.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "e2e: End-to-end tests (full workflows)",
    "slow: Slow-running tests",
    "weaviate: Requires Weaviate",
    "postgres: Requires PostgreSQL",
    "telegram: Requires Telegram API",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov-report=html",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mnemosyne"]
omit = ["*/tests/*", "*/__pycache__/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
