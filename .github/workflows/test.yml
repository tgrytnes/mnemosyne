name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v poetry >/dev/null 2>&1 || python -m pip install poetry
          poetry install --with dev

      - name: Run unit tests
        run: |
          poetry run pytest tests/unit -v --cov=. --cov-report=xml --cov-report=term-missing -m unit


  integration-tests:
    name: Integration Tests
    timeout-minutes: 25
    runs-on: ubuntu-latest

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:latest
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
          PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
          QUERY_DEFAULTS_LIMIT: '100'
          DEFAULT_VECTORIZER_MODULE: 'none'
          CLUSTER_HOSTNAME: 'node1'

      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ananke_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ollama models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-${{ runner.os }}-qwen3-embedding-0.6b-gemma3-1b-qwen3-0.6b-v1

      - name: Start Ollama container
        run: |
          # Create directory for Ollama models if it doesn't exist
          mkdir -p ~/.ollama

          # Fix: Use client2 experiment with MAXSTREAMS=1 to prevent concurrent write corruption
          # See: https://github.com/ollama/ollama/issues/8445
          docker run -d --name ollama \
            -p 11434:11434 \
            -v ~/.ollama:/root/.ollama \
            -e OLLAMA_EXPERIMENT=client2 \
            -e OLLAMA_REGISTRY_MAXSTREAMS=1 \
            ollama/ollama:latest

          # Wait for Ollama to be ready (use /api/tags endpoint for health check)
          timeout 120 bash -c 'until curl -sf http://localhost:11434/api/tags > /dev/null; do sleep 2; done'

          echo "Ollama is ready"

      - name: Pull Ollama models
        run: |
          # Check if model exists (from cache)
          model_exists() {
            docker exec ollama ollama list | grep -q "$1"
          }

          # Pull models (client2 prevents corruption, no retry needed)
          for model in "qwen3-embedding:0.6b" "gemma3:1b" "qwen3:0.6b"; do
            if model_exists "$model"; then
              echo "Model $model already exists (from cache), skipping download"
            else
              echo "Pulling $model..."
              docker exec ollama ollama pull "$model"
            fi
          done

          # Verify all models are available
          docker exec ollama ollama list

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng ghostscript poppler-utils

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/v1/.well-known/ready; do sleep 2; done'
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'

      - name: Seed Weaviate with fake vault
        env:
          TEST_VAULT_PATH: test_data/fake_vault
          WEAVIATE_HTTP_HOST: localhost
          WEAVIATE_HTTP_PORT: 8080
          WEAVIATE_GRPC_PORT: 50051
          OLLAMA_BASE_URL: http://localhost:11434
          INGESTION_STATE_DB: /tmp/ingestion_state_test.db
          RESET_COLLECTION: "true"
        run: |
          poetry run python scripts/seed_test_data.py

      - name: Run integration tests
        env:
          TEST_WEAVIATE_HOST: localhost
          TEST_WEAVIATE_PORT: 8080
          TEST_WEAVIATE_GRPC_PORT: 50051
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_DB: ananke_test
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: test
          OLLAMA_BASE_URL: http://localhost:11434
          TEST_OLLAMA_TIMEOUT: 120
          SEMANTIC_LLM_MODEL: gemma3:1b
        run: |
          poetry run pytest tests/integration -v --cov=. --cov-report=xml -m integration



  e2e-tests:
    name: E2E Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:latest
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
          PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
          QUERY_DEFAULTS_LIMIT: '100'
          DEFAULT_VECTORIZER_MODULE: 'none'
          CLUSTER_HOSTNAME: 'node1'

      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne_test_password
          POSTGRES_DB: mnemosyne_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ollama models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-${{ runner.os }}-qwen3-embedding-0.6b-gemma3-1b-qwen3-0.6b-v1

      - name: Start Ollama container
        run: |
          # Create directory for Ollama models if it doesn't exist
          mkdir -p ~/.ollama

          # Fix: Use client2 experiment with MAXSTREAMS=1 to prevent concurrent write corruption
          # See: https://github.com/ollama/ollama/issues/8445
          docker run -d --name ollama \
            -p 11434:11434 \
            -v ~/.ollama:/root/.ollama \
            -e OLLAMA_EXPERIMENT=client2 \
            -e OLLAMA_REGISTRY_MAXSTREAMS=1 \
            ollama/ollama:latest

          # Wait for Ollama to be ready (use /api/tags endpoint for health check)
          timeout 120 bash -c 'until curl -sf http://localhost:11434/api/tags > /dev/null; do sleep 2; done'

          echo "Ollama is ready"

      - name: Pull Ollama models
        run: |
          # Check if model exists (from cache)
          model_exists() {
            docker exec ollama ollama list | grep -q "$1"
          }

          # Pull models (client2 prevents corruption, no retry needed)
          for model in "qwen3-embedding:0.6b" "gemma3:1b" "qwen3:0.6b"; do
            if model_exists "$model"; then
              echo "Model $model already exists (from cache), skipping download"
            else
              echo "Pulling $model..."
              docker exec ollama ollama pull "$model"
            fi
          done

          # Verify all models are available
          docker exec ollama ollama list

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/v1/.well-known/ready; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:11434/api/tags; do sleep 2; done'

      - name: Run E2E tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          SEMANTIC_LLM_MODEL: gemma3:1b
          E2E_HYBRID_INGEST_FILE_COUNT: "10"
          E2E_HYBRID_INGEST_MAX_MINUTES: "10"
          INGEST_PROGRESS_EVERY: "1"
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_DB: mnemosyne_test
          TEST_POSTGRES_USER: mnemosyne
          TEST_POSTGRES_PASSWORD: mnemosyne_test_password
        run: |
          # Add live output to see which test is running
          poetry run pytest tests/e2e -v --tb=short -m e2e -s --capture=no --log-cli-level=INFO


  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Run Black formatter check
        run: |
          poetry run black --check .

      - name: Run Ruff linter
        run: |
          poetry run ruff check .

      - name: Run mypy type checker
        run: |
          poetry run mypy . --ignore-missing-imports || true

  test-summary:
    if: always()
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, code-quality]

    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] || \
             [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
