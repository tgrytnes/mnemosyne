[pytest]
# Pytest configuration for Mnemosyne project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Docker services)
    e2e: End-to-end tests (full workflows)
    performance: Performance tests (timing requirements)
    slow: Slow-running tests
    weaviate: Requires Weaviate
    postgres: Requires PostgreSQL
    telegram: Requires Telegram API

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

# Asyncio configuration
asyncio_mode = auto

# Test discovery patterns
norecursedirs = .git .tox build dist *.egg venv

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
