services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: mnemosyne_weaviate
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50061:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: 25
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - mnemosyne_net

  postgres:
    image: postgres:15
    container_name: mnemosyne_postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mnemosyne_net

  neo4j:
    image: neo4j:5
    container_name: mnemosyne_neo4j
    restart: unless-stopped
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}"
    volumes:
      - neo4j_data:/data
    networks:
      - mnemosyne_net

  mnemosyne_ingestor:
    image: ghcr.io/tgrytnes/mnemosyne:latest
    container_name: mnemosyne_ingestor
    restart: unless-stopped
    depends_on:
      - weaviate
      - postgres
      - neo4j
    env_file:
      - .env.production
    environment:
      OBSIDIAN_VAULT_PATH: /data/fake_vault
      EMAIL_ARCHIVE_PATH: /data/fake_emails
      PDF_SCAN_PATH: /data/fake_pdfs
      EMAIL_TSV: /data/fake_emails/cleaned_emails_full.tsv
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INGESTION_STATE_DB: /state/ingestion_state.db
      PYTHONPATH: /app/src
    volumes:
      - ./test_data/fake_vault:/data/fake_vault:ro
      - ./test_data/fake_emails:/data/fake_emails:ro
      - ./test_data/fake_pdfs:/data/fake_pdfs:ro
      - ingestion_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mnemosyne_net

  mnemosyne_scheduler:
    image: ghcr.io/tgrytnes/mnemosyne:latest
    container_name: mnemosyne_scheduler
    restart: unless-stopped
    depends_on:
      - weaviate
      - mnemosyne_ingestor
    env_file:
      - .env.production
    environment:
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SCHEDULER_INTERVAL_HOURS: ${SCHEDULER_INTERVAL_HOURS:-24}
      N_CLUSTERS: ${N_CLUSTERS:-50}
      PYTHONPATH: /app/src
    command: ["python", "-m", "mnemosyne.cli.scheduler"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mnemosyne_net

networks:
  mnemosyne_net:
    driver: bridge

volumes:
  weaviate_data:
  postgres_data:
  neo4j_data:
  ingestion_state:
