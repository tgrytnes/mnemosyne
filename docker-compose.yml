services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    restart: unless-stopped
    ports:
      - "${WEAVIATE_HOST_PORT}:8080"
      - "${WEAVIATE_GRPC_HOST_PORT}:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: 25
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - ${DATA_ROOT}/weaviate:/var/lib/weaviate
    networks:
      - mnemosyne_net

  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - mnemosyne_net

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_HOST_PORT}:7474"
      - "${NEO4J_BOLT_HOST_PORT}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}"
    volumes:
      - ${DATA_ROOT}/neo4j:/data
    networks:
      - mnemosyne_net

  mnemosyne_ingestor:
    image: ghcr.io/tgrytnes/mnemosyne:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - weaviate
      - postgres
      - neo4j
    environment:
      OBSIDIAN_VAULT_PATH: /data/vault
      EMAIL_ARCHIVE_PATH: /data/emails
      SOURCE_DIR: ${SOURCE_DIR:-/data/emails}
      PDF_SCAN_PATH: /data/pdfs
      INGESTOR_WATCH_ENABLED: ${INGESTOR_WATCH_ENABLED:-true}
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INGESTION_STATE_DB: /state/ingestion_state.db
      PYTHONPATH: /app/src
    healthcheck:
      test: ["CMD-SHELL", "[ \"${INGESTOR_WATCH_ENABLED:-true}\" = \"false\" ] && exit 0; pgrep -f \"mnemosyne.cli.ingest watch\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ${DATA_ROOT}/vault:/data/vault:ro
      - ${DATA_ROOT}/emails:/data/emails:ro
      - ${DATA_ROOT}/pdfs:/data/pdfs:ro
      - ${DATA_ROOT}/ingestion_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mnemosyne_net

  mnemosyne_scheduler:
    image: ghcr.io/tgrytnes/mnemosyne:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - weaviate
      - postgres
      - neo4j
      - mnemosyne_ingestor
    environment:
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/data/vault}
      MESSAGE_OUTBOX_PATH: ${MESSAGE_OUTBOX_PATH:-/state/message_outbox.db}
      SCHEDULER_INTERVAL_HOURS: ${SCHEDULER_INTERVAL_HOURS:-24}
      N_CLUSTERS: ${N_CLUSTERS:-50}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      PYTHONPATH: /app/src
    command: ["python", "-m", "mnemosyne.cli.scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "[ \"${SCHEDULER_ENABLED:-true}\" = \"false\" ] && exit 0; pgrep -f \"mnemosyne.cli.scheduler\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_ROOT}/vault:/data/vault
      - ${DATA_ROOT}/outbox:/state
    networks:
      - mnemosyne_net

  mnemosyne_hermes:
    image: ghcr.io/tgrytnes/mnemosyne:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      MESSAGE_OUTBOX_PATH: ${MESSAGE_OUTBOX_PATH:-/state/message_outbox.db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      TELEGRAM_POLL_INTERVAL_SECONDS: ${TELEGRAM_POLL_INTERVAL_SECONDS:-30}
      TELEGRAM_REPLY_TIMEOUT_SECONDS: ${TELEGRAM_REPLY_TIMEOUT_SECONDS:-25}
      TELEGRAM_SEND_LIMIT: ${TELEGRAM_SEND_LIMIT:-10}
      PYTHONPATH: /app/src
    command: ["python", "-m", "mnemosyne.cli.hermes"]
    volumes:
      - ${DATA_ROOT}/outbox:/state
    networks:
      - mnemosyne_net

networks:
  mnemosyne_net:
    driver: bridge
